base_url = "https://tsukiyokai.github.io"
theme    = "even"

title            = "shanshan's blog"
description      = "tech & life"
default_language = "zh"
author           = "shanshan"

compile_sass   = true
minify_html    = false
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "tags", feed = true },
]

[markdown]
smart_punctuation           = true
external_links_target_blank = true

[markdown.highlighting]
theme = "dracula"

[extra]
even_title = "shanshan"
even_menu  = [
    { url = "$BASE_URL",          name = "Home"     },
    { url = "$BASE_URL/tags",     name = "Tags"     },
    { url = "$BASE_URL/projects", name = "Projects" },
]
