{% extends "base.html" %}

{% block title %}{{ term.name }} - {{ config.title }}{% endblock %}

{% block content %}
<h1>#{{ term.name }}</h1>
<ul>
{% for page in term.pages %}
    <li>{{ page.date | date(format="%Y-%m-%d") }} - <a href="{{ page.permalink }}">{{ page.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
