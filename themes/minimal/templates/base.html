<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <style>
    .date  { color: #888; font-size: 0.85em; }
    .tag   { color: #888; font-size: 0.85em; }
    .desc  { color: #666; font-size: 0.85em; }
    .entry-list li > a:first-of-type { font-family: Georgia, "Noto Serif SC", serif; font-size: 1.5em; }
    .footnote-definition { display: flex; gap: 0.4em; }
    .footnote-definition p { margin: 0; }
    li:has(> input[type="checkbox"]) { list-style: none; }
    .toc { font-size: 0.85em; line-height: 1; }
    .toc ul { padding-left: 1em; }
    .toc a { text-decoration: none; }
    .algo { border: 1px solid #ccc; padding: 0.8em 1.2em; margin: 1em 0; font-family: Georgia, "Noto Serif SC", serif; font-size: 0.92em; line-height: 1.7; max-width: 36em; }
    .algo-cap { font-variant: small-caps; font-size: 1.05em; letter-spacing: 0.03em; border-bottom: 1px solid #ccc; padding-bottom: 0.3em; margin-bottom: 0.5em; }
    .algo .kw { font-variant: small-caps; }
    .algo .fn { font-style: italic; }
    .algo .cm { color: #888; font-size: 0.9em; }
    .algo ol { margin: 0; padding-left: 1.8em; }
    .algo ol li { padding-left: 0.3em; }
    .algo ol li::marker { font-size: 0.85em; color: #999; }
    .ps-root { font-size: 1.05em !important; }
  </style>
  {% block css %}{% endblock %}
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="/rss.xml">
</head>
<body>
  <nav>
    <a href="/">home</a> /
    <a href="/blog/">blog</a> /
    <a href="/projects/">proj</a>
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
